<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="laranail — a family of Laravel packages by Simtabi">
  <defs>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#D7263D"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="400" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <circle cx="1185" cy="185" r="215" fill="url(#crimson)" opacity="0.85"/>
    <circle cx="985" cy="345" r="118" fill="none" stroke="url(#crimson)" stroke-width="3" opacity="0.4"/>
    <circle cx="920" cy="80" r="7" fill="#FF5A6E" opacity="0.7"/>
    <text x="82" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#E6E1DE">laranail<tspan fill="#FF5A6E">.</tspan></text>
    <text x="85" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29" fill="#8B8683">Build your own Laravel packages without the ceremony.</text>
  </g>
</svg>
