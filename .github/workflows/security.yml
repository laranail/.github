name: Security (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      php-extensions:
        type: string
        default: 'mbstring, xml, ctype, iconv, intl'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: >-
          1Password service-account token, scoped to the CI vault. The one credential GitHub holds:
          every other secret this workflow needs is named by an `op://` reference below and fetched
          at run time, so rotating one is an edit in 1Password and nothing here changes.
          Optional -- without it the scan is skipped with a warning rather than failing, so adding a
          job that needs a credential cannot redden every caller before the credential exists.
          A caller must pass `secrets: inherit` for it to arrive at all.
        required: false

# Least privilege. Without this the jobs inherit the calling repository's default token scope,
# which on an older repository is still read/write on everything. Every job here only reads the
# tree; the ggshield step authenticates to GitGuardian with its own key, not with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2

      - name: Install dependencies
        # `composer install` will create composer.lock for libraries that
        # don't commit one — required by `composer audit --locked`.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: composer audit
        run: composer audit --locked --no-dev --abandoned=report --format=plain

  osv-scan:
    name: OSV.dev scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        # OSV-Scanner reads `composer.lock`. Repos in this suite don't commit lock files
        # (libraries), so the next step generates one before scanning.
        #
        # These MUST be the inputs, not literals. A caller whose composer.json floors PHP above the
        # literal gets "Your requirements could not be resolved to an installable set of packages"
        # from composer -- an error naming neither PHP nor a version, in a job called "OSV.dev scan",
        # so it reads as a scanner fault. laranail/chrono (php ^8.5) failed exactly this way against
        # a hardcoded '8.4', while callers on ^8.4.1 || ^8.5 passed and hid it.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2

      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          # OSV-scanner v2 changed both flags:
          # - `--skip-git` removed (binary auto-ignores .git/).
          # - `--lockfile=composer.lock` errors with "could not determine
          #   extractor"; v2 expects `--recursive` discovery to find the
          #   lock file via its built-in extractors.
          scan-args: |-
            --recursive
            ./

  secret-scan:
    name: ggshield secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # ggshield scans the range a pull request adds, so it needs the history to diff against.
          fetch-depth: 0

      # The key is optional, and the job says so rather than failing closed on configuration.
      # Failing closed is right for a FINDING -- a leaked credential must stop the build -- and
      # wrong for a missing setting, which would paint every caller red for a reason none of them
      # introduced. Same shape as simtabi/repo-templates' Refresh Bot credentials gate.
      - name: Is 1Password reachable?
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        run: |
          if [ "${HAS_TOKEN}" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=secret scan skipped::No OP_SERVICE_ACCOUNT_TOKEN reached this workflow, so ggshield did not run. Set it as an org secret and have the caller pass secrets: inherit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The op:// reference is a location, not a value, so it belongs here in plain text: it
      # documents what the job needs, and rotating the credential behind it changes nothing in
      # this file. GITGUARDIAN_API_KEY is exported into the job's environment for the next step.
      - name: Load secrets from 1Password
        if: steps.creds.outputs.ready == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITGUARDIAN_API_KEY: op://CI/GitGuardian/credential

      - name: ggshield secret scan
        if: steps.creds.outputs.ready == 'true'
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
