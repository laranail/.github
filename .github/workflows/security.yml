name: Security (reusable)

on:
  workflow_call:
    inputs:
      php-version:
        type: string
        default: '8.4'
      php-extensions:
        type: string
        default: 'mbstring, xml, ctype, iconv, intl'
    secrets:
      GITGUARDIAN_API_KEY:
        description: >-
          GitGuardian API key. Optional: without it the scan step is skipped with a warning rather
          than failing, so adding this job cannot turn every caller red before the key exists.
          A caller must pass `secrets: inherit` (or the key by name) for it to arrive at all.
        required: false

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2

      - name: Install dependencies
        # `composer install` will create composer.lock for libraries that
        # don't commit one — required by `composer audit --locked`.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: composer audit
        run: composer audit --locked --no-dev --abandoned=report --format=plain

  osv-scan:
    name: OSV.dev scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (generate composer.lock)
        # OSV-Scanner reads `composer.lock`. Repos in this suite don't
        # commit lock files (libraries), so generate one before scanning.
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # OSV-scanner v2 changed both flags:
          # - `--skip-git` removed (binary auto-ignores .git/).
          # - `--lockfile=composer.lock` errors with "could not determine
          #   extractor"; v2 expects `--recursive` discovery to find the
          #   lock file via its built-in extractors.
          scan-args: |-
            --recursive
            ./

  secret-scan:
    name: ggshield secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ggshield scans the range a pull request adds, so it needs the history to diff against.
          fetch-depth: 0

      # The key is optional, and the job says so rather than failing closed on configuration.
      # Failing closed is right for a FINDING -- a leaked credential must stop the build -- and
      # wrong for a missing setting, which would paint every caller red for a reason none of them
      # introduced. Same shape as simtabi/repo-templates' Refresh Bot credentials gate.
      - name: Is the scanner configured?
        id: creds
        env:
          HAS_KEY: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        run: |
          if [ "${HAS_KEY}" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=ggshield not configured::No GITGUARDIAN_API_KEY reached this workflow, so no secret scan ran. Add it as an org secret and have the caller pass secrets: inherit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ggshield secret scan
        if: steps.creds.outputs.ready == 'true'
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
