name: Tests (reusable)

# Install at: laranail/.github  ->  .github/workflows/tests.yml
#
# Changes from the version dated 2026-08-28, each of which a caller cannot work
# around on its own:
#
#   1. `laravel-versions` defaults to ["*"], which pins nothing. The old default
#      ran `composer require illuminate/contracts:13.*`, and `--no-update` EDITS
#      composer.json -- verified: `^13.0` becomes `13.*` -- so every caller
#      tested a manifest it does not ship. `--dev` also ADDED illuminate/contracts
#      to require-dev for packages that required laravel/framework instead.
#   2. laranail/* dist archives are dropped before installing. Those resolve
#      through a single MOVING v0.1.0 tag, so composer's cache is keyed on a name
#      whose contents change underneath it; a restored archive is silently stale
#      and the install still reports success. Without this, adopting this
#      workflow would reintroduce a bug this org has already been bitten by.
#   3. Pest runs exactly once. The plain run fired on every leg and the coverage
#      leg then ran the whole suite a SECOND time, with continue-on-error
#      swallowing any failure in that second run.
#   4. New `os` and `test-command` inputs, so packages with a Windows leg or a
#      coverage threshold can adopt this instead of staying hand-rolled.

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions to test against.
        type: string
        default: '["8.4","8.5"]'
      os:
        description: JSON array of runner labels.
        type: string
        default: '["ubuntu-latest"]'
      laravel-versions:
        description: >
          JSON array of Laravel constraints. The default '["*"]' means "resolve
          whatever composer.json allows" and pins nothing -- which is what you
          want almost always, because the constraint under test is then the one
          the package actually ships. Pass explicit constraints ONLY to fan out
          across several Laravel majors on purpose; each one rewrites
          composer.json before the suite runs.
        type: string
        default: '["*"]'
      stabilities:
        description: >
          JSON array of composer dependency-version preferences. prefer-lowest is
          what actually installs the floor composer.json declares; without it a
          wrong floor can ship for months.
        type: string
        default: '["prefer-lowest","prefer-stable"]'
      test-command:
        description: 'Command that runs the suite.'
        type: string
        default: 'vendor/bin/pest --colors=never'
      timeout-minutes:
        description: 'Per-job timeout.'
        type: number
        default: 15
      coverage-on:
        description: >
          Matrix leg to upload coverage from, as php=..,laravel=..,stability=..
          Empty = no upload. Must name the laravel value actually in the matrix,
          which is `*` unless you passed laravel-versions.
        type: string
        default: ''
      php-extensions:
        description: 'PHP extensions to install.'
        type: string
        default: 'mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3'
      private-dep-owner:
        description: >
          Set this when the package resolves a PRIVATE repository through a `vcs`
          entry, to the owner that holds it (e.g. `simtabi`). The job then mints a
          per-run app installation token for that owner and gives it to composer.
          Leave it unset for a public-only package: nothing changes.

          One token covers one owner, because an installation token is per
          installation. A package with private dependencies in two orgs needs a
          different approach and will fail loudly here rather than half-resolve.
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        required: false
      REFRESH_APP_PRIVATE_KEY:
        required: false
        description: >
          The Refresh Bot private key, needed only with `private-dep-owner`. It is
          passed as a secret and used to mint the token INSIDE this workflow, so the
          token itself never crosses a workflow boundary. A caller cannot hand a
          minted token to a reusable workflow safely: that would have to travel as a
          job output, and job outputs are not redacted.
      COMPOSER_AUTH_TOKEN:
        required: false
        description: >
          Token with read access to any PRIVATE laranail repository this package
          resolves through a `vcs` repository. GITHUB_TOKEN cannot do it: it is
          scoped to the repository the workflow runs in, so a sibling private
          package fails with "Invalid username or token" against a token that is
          present and valid for everything else. Omit it and the install falls
          back to GITHUB_TOKEN, which is correct for every public-only package.

jobs:
  pest:
    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}${{ matrix.os != 'ubuntu-latest' && format(' · {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # One cell failing must not cancel the others; which cells fail is the signal.
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php: ${{ fromJson(inputs.php-versions) }}
        laravel: ${{ fromJson(inputs.laravel-versions) }}
        stability: ${{ fromJson(inputs.stabilities) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.php-extensions }}
          ini-values: memory_limit=-1
          # pcov unconditionally, even when nothing uploads the report. Most
          # phpunit.xml in this family set failOnWarning="true" AND configure
          # <coverage><report>, so PHPUnit asks for a driver, finds none, warns --
          # and the warning is promoted to a failure. The suite then exits 1 having
          # run no tests. Installing the extension is cheap; the collection cost is
          # only paid when a report is actually requested.
          coverage: pcov
          tools: composer:v2

      - name: Resolve composer cache dir
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-
            composer-${{ matrix.os }}-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-${{ matrix.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's
        # dist cache is keyed on a name whose contents change underneath it. A
        # restored archive is then silently stale: the install reports success
        # and unpacks whatever was cached the first time. Everything else is
        # immutable per version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where
        # this would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      # Runs only when a caller deliberately asked for a specific Laravel major.
      # It EDITS composer.json, so the suite then tests a manifest the package
      # does not ship -- acceptable when fanning out across majors on purpose,
      # never as a default.
      - name: Pin Laravel constraint (explicitly requested)
        if: matrix.laravel != '*'
        shell: bash
        run: |
          composer require --dev --no-update --no-interaction \
            "illuminate/contracts:${{ matrix.laravel }}"

      # GITHUB_TOKEN is scoped to the repository the workflow runs in, so a private
      # sibling package -- especially one in another org -- fails the clone with
      # "Invalid username or token", an auth error that reads like a dependency
      # problem. An app installation token for the owner that holds it is the fix.
      - name: Mint a token for the private sibling
        id: sibling-token
        if: inputs.private-dep-owner != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: ${{ inputs.private-dep-owner }}
          permission-contents: read

      # A caller that DECLARED a private dependency gets a hard failure here rather
      # than the GITHUB_TOKEN fallback, which would surface eight steps later as a
      # clone error. Undeclared callers keep the fallback, which is correct for them.
      - name: Require that token
        if: inputs.private-dep-owner != ''
        shell: bash
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::private-dep-owner is '${{ inputs.private-dep-owner }}' but no app token was minted. Pass REFRESH_APP_PRIVATE_KEY and set the REFRESH_APP_CLIENT_ID variable. On GitHub Free a PRIVATE caller cannot read org-level secrets or variables and needs repository copies of both."
            exit 1
          fi
        env:
          TOKEN: ${{ steps.sibling-token.outputs.token }}

      - name: Install dependencies (${{ matrix.stability }})
        shell: bash
        env:
          # Precedence: the token minted for a declared private owner, then a token
          # the caller supplied explicitly, then the built-in one. The last keeps
          # every public-only package resolving exactly as before.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ steps.sibling-token.outputs.token || secrets.COMPOSER_AUTH_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        # --prefer-stable alongside --prefer-lowest on purpose: bare
        # --prefer-lowest resolves the lowest UNSTABLE release of every
        # dependency, which fails for reasons unrelated to this package.
        # Composer accepts the flag twice, so no branch is needed.
        run: composer update --${{ matrix.stability }} --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Determine coverage upload
        id: coverage-leg
        shell: bash
        run: |
          want="${{ inputs.coverage-on }}"
          got="php=${{ matrix.php }},laravel=${{ matrix.laravel }},stability=${{ matrix.stability }}"
          if [ -n "$want" ] && [ "$want" = "$got" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      # Exactly one of these runs.
      - name: Run tests
        if: steps.coverage-leg.outputs.upload != 'true'
        shell: bash
        run: ${{ inputs.test-command }}

      - name: Run tests (with coverage)
        if: steps.coverage-leg.outputs.upload == 'true'
        shell: bash
        run: ${{ inputs.test-command }} --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        if: steps.coverage-leg.outputs.upload == 'true' && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
